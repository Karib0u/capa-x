name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (dry run; no release is published)"
        required: true

permissions:
  contents: write

jobs:
  archive:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: the archive is a single static binary that runs on
          # any Linux regardless of the host glibc version, which is the whole
          # point of shipping a binary rather than a build. Nothing in the
          # dependency tree links C (flate2 uses the miniz_oxide backend), so
          # this needs the target and musl-tools and nothing else.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The archive ships the rules, so this one submodule is required.
          # reference/capa and tests/testfiles are parity-only and stay out.
          submodules: false

      - name: Fetch pinned rules
        run: git submodule update --init --depth 1 rules

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p capa-x-cli --target ${{ matrix.target }}

      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          stage="capa-x-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"

          binary="target/${{ matrix.target }}/release/capa-x"
          if [[ -f "${binary}.exe" ]]; then
            binary="${binary}.exe"
          fi
          cp "$binary" "dist/${stage}/"

          # The binary embeds its FLIRT signatures but not the rules, and
          # `capa-x` with no --rules falls back to `rules/` beside the
          # executable -- so this layout runs from any working directory.
          cp -R rules "dist/${stage}/rules"
          rm -rf "dist/${stage}/rules/.git"
          cp LICENSE NOTICE README.md KNOWN_DIVERGENCES.md PINNED.md "dist/${stage}/"

          echo "STAGE=${stage}" >> "$GITHUB_ENV"

      - name: Smoke-test the staged archive
        shell: bash
        run: |
          set -euo pipefail
          bin="${GITHUB_WORKSPACE}/dist/${STAGE}/capa-x"
          if [[ -f "${bin}.exe" ]]; then
            bin="${bin}.exe"
          fi

          # Run from a directory that is NOT the archive's own, so a broken
          # rules fallback fails here rather than in a user's hands.
          workdir="${RUNNER_TEMP}/elsewhere"
          mkdir -p "$workdir"
          cd "$workdir"

          "$bin" --version

          # Analysing raw shellcode is the one input format supported on every
          # runner (the binary itself is Mach-O on macOS, which capa-x does
          # not read). Rules must load for this to exit 0, which is the point:
          # a missing or unfound rules/ directory exits non-zero and fails here.
          printf '\x31\xc0\x40\xc3' > tiny.bin
          "$bin" -f sc32 tiny.bin > /dev/null
          echo "ok: ran from $workdir with rules resolved beside the executable"

      - name: Pack (tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          cd dist && tar -czf "${STAGE}.tar.gz" "${STAGE}"

      - name: Pack (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:STAGE" -DestinationPath "dist/$env:STAGE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: capa-x-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # J15 (docs/BENCHMARKS.md): abi3 wheels for the published target matrix,
  # each one built, imported, and used to scan a sample. Tag/manual-dispatch
  # only -- a five-platform wheel matrix is not a per-push cost, and every
  # push already gets a linux-only build plus the binding-parity check
  # (`.github/workflows/ci.yml`'s `python-binding` job).
  wheels:
    name: wheels (${{ matrix.os }} / ${{ matrix.cibw-archs }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw-archs: x86_64
          - os: ubuntu-latest
            cibw-archs: aarch64
            qemu: true
          - os: macos-latest
            cibw-archs: x86_64
          - os: macos-latest
            cibw-archs: arm64
          - os: windows-latest
            cibw-archs: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The wheel's own `CIBW_TEST_COMMAND` scans a sample, which needs
          # both `rules/` (the same one submodule `archive` fetches) and one
          # small `tests/testfiles/` sample.
          submodules: false

      - name: Fetch test submodules
        run: git submodule update --init --depth 1 rules tests/testfiles

      - name: Set up QEMU (linux/aarch64 cross-build)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: dtolnay/rust-toolchain@stable

      # `cibuildwheel` on macOS shells out to `cargo build --target
      # <arch>-apple-darwin`; both targets must be installed explicitly when
      # cross-building the non-native one (arm64 runner building x86_64, or
      # vice versa).
      - name: Add the other Darwin target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: capa-x-python
          output-dir: wheelhouse
        env:
          # abi3-py38 (capa-x-python/Cargo.toml): one wheel covers every
          # CPython >= 3.8, so building only against cp38's ABI is correct,
          # not a narrowing -- see `docs/decisions/0006-python-binding.md`.
          CIBW_BUILD: "cp38-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS: ${{ matrix.cibw-archs }}
          # A smoke test, not a measurement (docs/BENCHMARKS.md "Binding
          # corpus"): install, import, scan one sample. `{project}` is
          # cibuildwheel's placeholder for this job's checkout root, which
          # is why `rules`/`tests/testfiles` are fetched above rather than
          # left to `fetch_rules` -- a release smoke test must not touch the
          # network.
          CIBW_TEST_COMMAND: >
            python -c "from pathlib import Path; import capa_x;
            root = Path(r'{project}');
            rules = capa_x.Rules.from_directory(root / 'rules');
            doc = capa_x.analyze(root / 'tests' / 'testfiles' / 'c335a9d41185a32ad918c5389ee54235.exe_', rules, jobs=1);
            assert doc['rules'];
            print('scanned', len(doc['rules']), 'matched rules')"
          # Linux wheels build inside manylinux containers, which cannot see
          # the host runner's Rust toolchain. Install Rust in each container
          # so maturin does not request puccinialin, which has no Python 3.8
          # distribution for the cp38 abi3 build.
          CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          # Rust requires macOS 10.12 or newer, while cibuildwheel defaults
          # CPython 3.8 macOS wheels to 10.9.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=10.12

      - uses: actions/upload-artifact@v4
        with:
          name: capa-x-python-wheels-${{ matrix.os }}-${{ matrix.cibw-archs }}
          path: wheelhouse/*.whl

  publish:
    needs: [archive, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match workspace version ${expected}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/**/*.whl
          body: |
            capa-x ${{ github.ref_name }} is an independent project, not
            affiliated with or endorsed by Google LLC or Mandiant, Inc.

            Release-gate evidence is measured fresh on each release tree:
            rule-level agreement with pinned Python capa on the 200-sample
            corpus is recorded in `docs/BENCHMARKS.md`, and known differences
            are documented in `KNOWN_DIVERGENCES.md`.

            Each archive contains the `capa-x` binary and the pinned
            [capa-rules](https://github.com/mandiant/capa-rules) it was built
            against, so it runs with no further downloads:

            ```
            tar -xzf capa-x-<version>-<target>.tar.gz
            cd capa-x-<version>-<target>
            ./capa-x <sample>
            ```

            Python bindings are attached as abi3 wheels. Install one directly:

            ```
            pip install capa_x-<version>-cp38-abi3-<platform>.whl
            ```

            FLIRT signatures are compiled into the binary. Pinned upstream
            versions are in `PINNED.md`; known result differences against
            Python capa are in `KNOWN_DIVERGENCES.md`.
          fail_on_unmatched_files: true
